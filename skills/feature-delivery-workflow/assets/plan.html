<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="source-sha256" content="{{HASH}}">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light;--ink:#203147;--muted:#596b7e;--line:#dce4ed;--blue:#edf5ff;--yellow:#fff6dd;--gray:#f4f6f9;--accent:#245d99}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:#eef2f6;color:var(--ink);font:16px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:4px}a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid #2775be;outline-offset:3px}
.layout{max-width:1390px;margin:auto;display:grid;grid-template-columns:264px minmax(0,1fr);gap:32px;padding:36px 32px 80px}.sidebar{position:sticky;top:28px;align-self:start;max-height:calc(100vh - 56px);overflow:auto;padding:22px 18px;background:#f9fbfd;border:1px solid var(--line);border-radius:16px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}.sidebar h2{font-size:18px;margin:6px 0 18px}.sidebar a{display:block;padding:6px 9px;text-decoration:none;font-size:14px;line-height:1.55;border-radius:6px;overflow-wrap:anywhere}.sidebar a:hover{background:var(--blue)}.sidebar .level-3{padding-left:21px;font-size:12px;color:var(--muted)}main{min-width:0;max-width:960px}.intro{padding:8px 4px 16px}.topic{background:white;border:1px solid var(--line);border-radius:16px;padding:28px 34px;margin:0 0 24px;box-shadow:0 4px 18px #24374c04}.topic.technical{background:#fafbfd}.topic:first-of-type{background:var(--blue)}h1{font-size:32px;line-height:1.4;letter-spacing:-.02em;margin:8px 0 20px}h2{font-size:23px;line-height:1.5;margin:0 0 20px}h3{font-size:18px;line-height:1.6;margin:30px 0 12px;border-top:1px solid var(--line);padding-top:22px}h2+h3{border:0;padding-top:0;margin-top:0}p{margin:12px 0;overflow-wrap:anywhere}li{margin:8px 0;overflow-wrap:anywhere}ul,ol{padding-left:24px}strong{font-weight:650;color:#182c43}.callout{padding:16px 20px;border-radius:10px;border-left:4px solid #6a96c9;margin:20px 0;background:var(--blue)}.callout.warning{background:var(--yellow);border-color:#bf933b}.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}.table-scroll{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.65}th{text-align:left;background:#eaf0f7;font-weight:650}td,th{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;min-width:100px;overflow-wrap:anywhere}tr:last-child td{border-bottom:0}tr:nth-child(even) td{background:#f8fafc}code{font-family:Consolas,"Cascadia Code",monospace;font-size:.88em;background:#eaf0f6;padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}.code-panel{min-width:0;margin:18px 0;border:1px solid #d5dfe9;border-radius:10px;overflow:hidden;background:var(--gray)}.code-toolbar{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:#e8edf3;font-size:12px;font-weight:700;letter-spacing:.04em}.copy{background:white;border:1px solid #bac9d8;border-radius:6px;padding:5px 12px;color:#244c77;cursor:pointer}.copy:hover{background:#edf5ff}pre{margin:0;padding:20px;overflow-x:auto;line-height:1.7;font-size:14px;tab-size:2}pre code{background:none;padding:0;border-radius:0;font-size:inherit;white-space:pre;overflow-wrap:normal}.tok-string{color:#227047}.tok-keyword{color:#7544a0;font-weight:600}.tok-number{color:#a75212}.tok-comment{color:#687c8d;font-style:italic}.footer{color:var(--muted);font-size:12px;overflow-wrap:anywhere;padding:8px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:20px;gap:20px}.sidebar{position:static;max-height:none}.sidebar nav{display:flex;flex-wrap:wrap;gap:5px}.sidebar .level-3{display:none}.sidebar a{background:#edf2f8}.sidebar h2{margin-bottom:10px}main{max-width:none}}
@media(max-width:520px){body{font-size:15px}.layout{padding:14px 10px 40px}.topic{padding:22px 18px;border-radius:12px}.sidebar{padding:16px}h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}td,th{padding:10px;min-width:90px}.callout{padding:14px}pre{padding:16px}.code-toolbar{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{body{background:white}.layout{display:block;padding:0}.sidebar,.copy{display:none}.topic{box-shadow:none;border-radius:0;break-inside:auto}h2,h3{break-after:avoid}pre{white-space:pre-wrap}pre code{white-space:pre-wrap;overflow-wrap:anywhere}.table-scroll{overflow:visible}a{color:inherit}}
</style>
</head>
<body><div class="layout"><aside class="sidebar"><div class="eyebrow">REVIEW DOCUMENT</div><h2>方案阅读导航</h2><nav aria-label="章节目录">{{TOC}}</nav></aside><main>{{BODY}}<footer class="footer">由 {{SOURCE}} 自动生成 · 内容以同版本 Markdown 为准<br>源文件 SHA-256：{{HASH}}</footer></main></div>
<script>
document.querySelectorAll('.copy').forEach(button=>button.addEventListener('click',async()=>{
 const text=button.closest('.code-panel').querySelector('code').textContent;
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}
  else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy');button.focus();}
  button.textContent='已复制';
 }catch{button.textContent='复制不可用，请选中代码复制';}
 setTimeout(()=>button.textContent='复制',2400);
}));
</script></body></html>
